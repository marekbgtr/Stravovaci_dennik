      var timeVal1 = isEdit ? editEntry.time : nowHM();
      h += '<div class="field-row"><div class="field-col"><label class="field-label">Množstvo (ml)</label><input class="field-input" id="field-amount" type="number" min="0" step="10" placeholder="250" value="' + esc(amountVal) + '" /></div>';
      h += '<div class="field-col"><label class="field-label">Čas</label><div class="time-input-wrap">' + iconClock(13, "#A39D8F") + '<input type="time" id="field-time" value="' + timeVal1 + '" /></div></div></div>';
    }

    // --- dose for liek ---
    if (type === "liek") {
      var doseVal = (isEdit && editEntry.dose) ? esc(editEntry.dose) : "";
      var timeVal2 = isEdit ? editEntry.time : nowHM();
      h += '<div class="field-row"><div class="field-col"><label class="field-label">Dávka</label><input class="field-input" id="field-dose" type="text" placeholder="napr. 500 mg / 1 tableta" value="' + doseVal + '" /></div>';
      h += '<div class="field-col"><label class="field-label">Čas</label><div class="time-input-wrap">' + iconClock(13, "#A39D8F") + '<input type="time" id="field-time" value="' + timeVal2 + '" /></div></div></div>';
    }

    // --- time field for types that haven't already placed it ---
    if (type === "jedlo" || type === "symptom" || type === "vylucovanie") {
      var timeVal3 = isEdit ? editEntry.time : nowHM();
      h += '<div class="field-row"><div class="field-col"><label class="field-label">Čas</label><div class="time-input-wrap">' + iconClock(13, "#A39D8F") + '<input type="time" id="field-time" value="' + timeVal3 + '" /></div></div>';
      if (type === "jedlo") {
        h += '<div class="field-col wide"></div>';
      }
      h += '</div>';
    }

    // --- activity: start time; end time editable only when editing an already-ended activity ---
    if (type === "aktivita") {
      var startVal = isEdit ? editEntry.time : nowHM();
      h += '<div class="field-row"><div class="field-col"><label class="field-label">Začiatok</label><div class="time-input-wrap">' + iconClock(13, "#A39D8F") + '<input type="time" id="field-time" value="' + startVal + '" /></div></div>';
      if (isEdit && editEntry.endTime) {
        h += '<div class="field-col"><label class="field-label">Koniec</label><div class="time-input-wrap">' + iconClock(13, "#A39D8F") + '<input type="time" id="field-endtime" value="' + editEntry.endTime + '" /></div></div>';
      }
      h += '</div>';
      if (!isEdit || !editEntry.endTime) {
        h += '<p class="field-hint">Aktivitu neskôr ukončíš rozkliknutím záznamu na časovej osi — vtedy sa zapíše trvanie.</p>';
      }
    }

    // --- severity for symptom ---
    if (type === "symptom") {
      var curSeverity = isEdit ? editEntry.severity : 1;
      h += '<div style="margin-bottom:14px;"><label class="field-label" style="margin-bottom:6px;">Intenzita</label><div class="severity-row" id="severity-row">';
      SEVERITY.forEach(function (s) {
        h += '<button type="button" class="severity-btn' + (s.v === curSeverity ? ' active' : '') + '" data-severity="' + s.v + '">' + s.label + '</button>';
      });
      h += '</div></div>';
    }

    var noteVal = isEdit && editEntry.note ? esc(editEntry.note) : "";
    h += '<textarea class="field-note" id="field-note" placeholder="Poznámka (voliteľné)" rows="2">' + noteVal + '</textarea>';
    var submitDisabled = (type === "vylucovanie") ? "" : (isEdit ? "" : " disabled");
    h += '<button type="submit" class="submit-btn" id="submit-entry"' + submitDisabled + ' style="background:' + meta.color + ';">' + (isRealEdit ? 'Uložiť zmeny' : 'Uložiť záznam') + '</button>';
    h += '</form></div>';
    return h;
  }

  function renderLinkModal(linkTargetId) {
    var symptom = state.entries.find(function (e) { return e.id === linkTargetId; });
    var symptomDate = symptom ? symptom.date : todayISO();
    // previous day included too: an evening meal can plausibly cause a symptom the next morning
    var d = new Date(symptomDate + "T00:00:00");
    d.setDate(d.getDate() - 1);
    var tz = d.getTimezoneOffset() * 60000;
    var dayBefore = new Date(d - tz).toISOString().slice(0, 10);

    var relevantDates = [symptomDate, dayBefore];
    var linkable = state.entries.filter(function (e) {
      return e.id !== linkTargetId && (e.type === "jedlo" || e.type === "aktivita") && relevantDates.indexOf(e.date) !== -1;
    }).sort(function (a, b) {
      if (a.date !== b.date) return b.date.localeCompare(a.date); // symptom day first, then day before
      return (a.time || "").localeCompare(b.time || "");
    });

    var h = '<div class="modal-overlay" id="link-modal-overlay">';
    h += '<div class="modal-sheet" style="max-height:70vh;overflow-y:auto;">';
    h += '<div class="modal-header"><span class="modal-title serif">Prepojiť s...</span><button class="modal-close" id="link-modal-close">' + iconX(20) + '</button></div>';
    if (linkable.length === 0) {
      h += '<p style="font-size:13px;color:#A39D8F;">V tento a predchádzajúci deň zatiaľ nemáš žiadne jedlo ani aktivitu na prepojenie.</p>';
    } else {
      var currentGroupDate = null;
      linkable.forEach(function (e) {
        if (e.date !== currentGroupDate) {
          currentGroupDate = e.date;
          var dayLabel = e.date === symptomDate ? "V deň symptómu (" + formatDateHuman(e.date) + ")" : "Deň predtým (" + formatDateHuman(e.date) + ")";
          h += '<div style="font-size:11px;font-weight:600;color:#A39D8F;text-transform:uppercase;letter-spacing:0.02em;margin:14px 0 6px;padding:0 4px;">' + esc(dayLabel) + '</div>';
        }
        var meta = TYPE_META[e.type];
        h += '<button class="link-list-item" data-link-select="' + e.id + '">';
        h += '<div class="link-list-icon" style="background:' + meta.bg + ';color:' + meta.color + ';">' + meta.svg(13, meta.color) + '</div>';
        h += '<div><div class="link-list-time">' + esc(e.time) + '</div><div class="link-list-title">' + esc(e.title) + '</div></div>';
        h += '</button>';
      });
    }
    h += '</div></div>';
    return h;
  }

  function renderImportModal(incoming) {
    var h = '<div class="modal-overlay" id="import-modal-overlay">';
    h += '<div class="modal-sheet">';
    h += '<div class="modal-header"><span class="modal-title serif">Importovať dáta</span><button class="modal-close" id="import-modal-close">' + iconX(20) + '</button></div>';
    h += '<p class="import-confirm">Súbor obsahuje ' + incoming.length + ' záznamov. Ako ich chceš pridať?</p>';
    h += '<div class="import-choice">';
    h += '<button class="merge" id="import-merge"><span class="opt-title">Zlúčiť s aktuálnym denníkom</span><span class="opt-sub">Pridá len záznamy, ktoré ešte nemáš</span></button>';
    h += '<button class="replace" id="import-replace"><span class="opt-title">Nahradiť celý denník</span><span class="opt-sub">Vymaže súčasné záznamy a nahradí ich importovanými</span></button>';
    h += '</div></div></div>';
    return h;
  }

  // ---------- event wiring ----------
  function attachHandlers() {
    var themeToggleBtn = document.getElementById("btn-theme-toggle");
    if (themeToggleBtn) themeToggleBtn.onclick = toggleTheme;

    var exportBtn = document.getElementById("btn-export");
    if (exportBtn) exportBtn.onclick = exportData;

    // tab navigation
    document.querySelectorAll("[data-view]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.view = btn.getAttribute("data-view");
        render();
      });
    });

    // stats range tabs
    document.querySelectorAll("[data-range]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.statsRange = parseInt(btn.getAttribute("data-range"), 10);
        render();
      });
    });

    // weight card
    var weightEditBtn = document.getElementById("btn-weight-edit");
    if (weightEditBtn) weightEditBtn.onclick = function () { state.weightEditOpen = true; render(); };

    var weightOverlay = document.getElementById("weight-modal-overlay");
    if (weightOverlay) {
      weightOverlay.addEventListener("click", function (ev) { if (ev.target === weightOverlay) { state.weightEditOpen = false; render(); } });
      var weightClose = document.getElementById("weight-modal-close");
      if (weightClose) weightClose.onclick = function () { state.weightEditOpen = false; render(); };
      var submitWeight = document.getElementById("submit-weight");
      if (submitWeight) {
        submitWeight.onclick = function () {
          var input = document.getElementById("field-weight");
          var val = input && input.value ? parseFloat(input.value) : null;
          var targetDate = state.selectedDate;
          state.weightEditOpen = false;
          setWeightForDate(targetDate, val);
        };
      }
      var deleteWeightBtn = document.getElementById("delete-weight");
      if (deleteWeightBtn) {
        deleteWeightBtn.onclick = function () {
          var targetDate = state.selectedDate;
          state.weightEditOpen = false;
          setWeightForDate(targetDate, null);
        };
      }
    }

    // print export
    var printBtn = document.getElementById("btn-print");
    if (printBtn) printBtn.onclick = function () { state.printModalOpen = true; render(); };

    var printOverlay = document.getElementById("print-modal-overlay");
    if (printOverlay) {
      printOverlay.addEventListener("click", function (ev) { if (ev.target === printOverlay) { state.printModalOpen = false; render(); } });
      var printClose = document.getElementById("print-modal-close");
      if (printClose) printClose.onclick = function () { state.printModalOpen = false; render(); };

      document.querySelectorAll("[data-print-range]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var val = btn.getAttribute("data-print-range");
          if (val === "custom") {
            state.printRangeMode = "custom";
            if (!state.printCustomFrom) state.printCustomFrom = daysAgoISO(6);
            if (!state.printCustomTo) state.printCustomTo = todayISO();
          } else {
            state.printRangeMode = "preset";
            state.printRange = parseInt(val, 10);
          }
          render();
        });
      });

      var printCustomFromInput = document.getElementById("print-custom-from");
      if (printCustomFromInput) {
        printCustomFromInput.addEventListener("change", function () {
          state.printCustomFrom = printCustomFromInput.value;
        });
      }
      var printCustomToInput = document.getElementById("print-custom-to");
      if (printCustomToInput) {
        printCustomToInput.addEventListener("change", function () {
          state.printCustomTo = printCustomToInput.value;
        });
      }

      var submitPrintWindow = document.getElementById("submit-print-window");
      if (submitPrintWindow) {
        submitPrintWindow.onclick = function () {
          var range = resolvePrintRange();
          state.printModalOpen = false;
          render();
          openPrintWindow(range);
        };
      }

      var submitPrintShare = document.getElementById("submit-print-share");
      if (submitPrintShare) {
        submitPrintShare.onclick = function () {
          var range = resolvePrintRange();
          state.printModalOpen = false;
          render();
          offerPrintContentForStandalone(range);
        };
      }
    }

    // AI export
    var aiExportBtn = document.getElementById("btn-ai-export");
    if (aiExportBtn) aiExportBtn.onclick = function () { state.aiExportModalOpen = true; render(); };

    var aiExportOverlay = document.getElementById("ai-export-modal-overlay");
    if (aiExportOverlay) {
      aiExportOverlay.addEventListener("click", function (ev) { if (ev.target === aiExportOverlay) { state.aiExportModalOpen = false; render(); } });
      var aiExportClose = document.getElementById("ai-export-modal-close");
      if (aiExportClose) aiExportClose.onclick = function () { state.aiExportModalOpen = false; render(); };

      document.querySelectorAll("[data-ai-range]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.aiExportRange = parseInt(btn.getAttribute("data-ai-range"), 10);
          render();
        });
      });

      var aiCopyBtn = document.getElementById("ai-export-copy");
      if (aiCopyBtn) {
        aiCopyBtn.onclick = function () {
          var textarea = document.getElementById("ai-export-textarea");
          textarea.select();
          textarea.setSelectionRange(0, 999999); // mobile Safari/Samsung Internet compatibility
          var copied = false;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(textarea.value);
              copied = true;
            } else {
              copied = document.execCommand("copy");
            }
          } catch (e) {
            try { copied = document.execCommand("copy"); } catch (e2) { copied = false; }
          }
          showToast(copied ? "Skopírované do schránky." : "Kopírovanie zlyhalo — skús označiť text ručne.");
        };
      }
    }

    var importBtn = document.getElementById("btn-import");
    var importInput = document.getElementById("import-file-input");
    if (importBtn && importInput) {
      importBtn.onclick = function () { importInput.click(); };
      importInput.onchange = function (e) {
        var file = e.target.files && e.target.files[0];
        if (file) handleImportFile(file);
        importInput.value = "";
      };
    }

    var importOverlay = document.getElementById("import-modal-overlay");
    if (importOverlay) {
      importOverlay.addEventListener("click", function (ev) { if (ev.target === importOverlay) cancelImport(); });
      var importClose = document.getElementById("import-modal-close");
      if (importClose) importClose.onclick = cancelImport;
      var mergeBtn = document.getElementById("import-merge");
      if (mergeBtn) mergeBtn.onclick = confirmImportMerge;
      var replaceBtn = document.getElementById("import-replace");
      if (replaceBtn) replaceBtn.onclick = confirmImportReplace;
    }

    var prevBtn = document.getElementById("btn-prev-day");
    if (prevBtn) prevBtn.onclick = function () { shiftDate(-1); };
    var nextBtn = document.getElementById("btn-next-day");
    if (nextBtn) nextBtn.onclick = function () { shiftDate(1); };
    var dateSelect = document.getElementById("date-select");
    if (dateSelect) dateSelect.onchange = function (e) { state.selectedDate = e.target.value; render(); };

    // open type picker
    var openPicker = document.getElementById("btn-open-picker");
    if (openPicker) openPicker.onclick = function () { state.typePicker = true; render(); };
    var pickerOverlay = document.getElementById("picker-overlay");
    if (pickerOverlay) {
      pickerOverlay.addEventListener("click", function (ev) { if (ev.target === pickerOverlay) { state.typePicker = false; render(); } });
      var pickerClose = document.getElementById("picker-close");
      if (pickerClose) pickerClose.onclick = function () { state.typePicker = false; render(); };
      pickerOverlay.querySelectorAll("[data-pick-type]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.typePicker = false;
          state.modal = btn.getAttribute("data-pick-type");
          state.editId = null;
          state.duplicateSeed = null;
          render();
          focusModalTitle();
        });
      });
    }

    // row toggle / actions
    document.querySelectorAll("[data-row-toggle]").forEach(function (el) {
      el.addEventListener("click", function (ev) {
        if (ev.target.closest("[data-link-btn]") || ev.target.closest("[data-delete-btn]") || ev.target.closest("[data-end-activity]") || ev.target.closest("[data-edit-btn]") || ev.target.closest("[data-duplicate-btn]")) return;
        var id = el.getAttribute("data-row-toggle");
        state.openRows[id] = !state.openRows[id];
        render();
      });
    });
    document.querySelectorAll("[data-delete-btn]").forEach(function (el) {
      el.addEventListener("click", function (ev) { ev.stopPropagation(); deleteEntry(el.getAttribute("data-delete-btn")); });
    });
    document.querySelectorAll("[data-link-btn]").forEach(function (el) {
      el.addEventListener("click", function (ev) { ev.stopPropagation(); state.linkTarget = el.getAttribute("data-link-btn"); render(); });
    });
    document.querySelectorAll("[data-edit-btn]").forEach(function (el) {
      el.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var id = el.getAttribute("data-edit-btn");
        var entry = state.entries.find(function (e) { return e.id === id; });
        if (!entry) return;
        state.editId = id;
        state.duplicateSeed = null;
        state.modal = entry.type;
        render();
        focusModalTitle();
      });
    });
    document.querySelectorAll("[data-duplicate-btn]").forEach(function (el) {
      el.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var id = el.getAttribute("data-duplicate-btn");
        var entry = state.entries.find(function (e) { return e.id === id; });
        if (!entry) return;
        var seed = Object.assign({}, entry);
        delete seed.id;
        delete seed.linkedTo;
        delete seed.endTime;
        seed.time = nowHM();
        state.editId = null;
        state.duplicateSeed = seed;
        state.modal = entry.type;
        render();
        showToast("Záznam duplikovaný — uprav podľa potreby a ulož.");
      });
    });
    document.querySelectorAll("[data-end-activity]").forEach(function (el) {
      el.addEventListener("click", function (ev) { ev.stopPropagation(); endActivity(el.getAttribute("data-end-activity")); });
    });

    // entry modal
    var overlay = document.getElementById("entry-modal-overlay");
    if (overlay) {
      overlay.addEventListener("click", function (ev) { if (ev.target === overlay) { state.modal = null; state.editId = null; state.duplicateSeed = null; render(); } });
      var closeBtn = document.getElementById("entry-modal-close");
      if (closeBtn) closeBtn.onclick = function () { state.modal = null; state.editId = null; state.duplicateSeed = null; render(); };

      var type = state.modal;
      var editEntry = state.editId ? state.entries.find(function (e) { return e.id === state.editId; }) : (state.duplicateSeed || null);
      var isRealEdit = !!state.editId;
      var titleInput = document.getElementById("field-title");
      var submitBtn = document.getElementById("submit-entry");

      function refreshSubmitState() {
        if (type === "vylucovanie" || editEntry) { submitBtn.disabled = false; return; }
        submitBtn.disabled = !titleInput || !titleInput.value.trim();
      }
      if (titleInput) titleInput.addEventListener("input", refreshSubmitState);

      var suggestRow = document.getElementById("title-suggest-row");
      if (suggestRow && titleInput) {
        suggestRow.querySelectorAll("[data-suggest]").forEach(function (chip) {
          chip.addEventListener("click", function () {
            titleInput.value = chip.getAttribute("data-suggest");
            refreshSubmitState();
            titleInput.focus();
          });
        });
      }

      // Symptom searchable "database" dropdown: filters existing symptom
      // titles as the person types, and — when a not-yet-selected new name
      // is typed — shows a non-blocking similarity warning listing existing
      // titles that share meaningful words, so the person can catch a
      // near-duplicate themselves before saving (per their choice: warn but
      // don't force).
      var symptomDropdownList = document.getElementById("symptom-dropdown-list");
      var symptomSimilarWarning = document.getElementById("symptom-similar-warning");
      var symptomJustPicked = false; // true right after clicking a dropdown item, to suppress its own dropdown reopening

      if (symptomDropdownList && titleInput) {
        var allSymptomTitles = getAllDistinctTitles("symptom");

        function renderSymptomDropdown() {
          var query = titleInput.value.trim().toLowerCase();
          if (symptomJustPicked) { symptomDropdownList.innerHTML = ""; return; }
          if (!query) { symptomDropdownList.innerHTML = ""; return; }

          var matches = allSymptomTitles.filter(function (t) { return t.toLowerCase().indexOf(query) !== -1; });
          var exactMatch = allSymptomTitles.some(function (t) { return t.toLowerCase() === query; });

          if (matches.length === 0) {
            symptomDropdownList.innerHTML = "";
            return;
          }
          var html = '<div class="symptom-dropdown-list">';
          matches.slice(0, 8).forEach(function (t) {
            html += '<button type="button" class="symptom-dropdown-item" data-pick-symptom="' + esc(t) + '">' + esc(t) + '</button>';
          });
          html += '</div>';
          symptomDropdownList.innerHTML = html;
          symptomDropdownList.querySelectorAll("[data-pick-symptom]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              titleInput.value = btn.getAttribute("data-pick-symptom");
              symptomJustPicked = true;
              symptomDropdownList.innerHTML = "";
              symptomSimilarWarning.innerHTML = "";
              refreshSubmitState();
            });
          });
        }

        function renderSimilarWarning() {
          var current = titleInput.value.trim();
          if (!current || symptomJustPicked) { symptomSimilarWarning.innerHTML = ""; return; }
          var exactMatch = allSymptomTitles.some(function (t) { return t.toLowerCase() === current.toLowerCase(); });
          if (exactMatch) { symptomSimilarWarning.innerHTML = ""; return; }

          var similar = findSimilarTitles(current, "symptom");
          if (similar.length === 0) { symptomSimilarWarning.innerHTML = ""; return; }

          var html = '<div class="symptom-similar-warning"><p>Toto vyzerá podobne ako už zaznamenané symptómy — vyber jeden z nich, ak ide o to isté, alebo pokračuj s novým názvom:</p>';
          similar.forEach(function (t) {
            html += '<button type="button" class="symptom-similar-item" data-pick-symptom-similar="' + esc(t) + '">' + esc(t) + '</button>';
          });
          html += '</div>';
          symptomSimilarWarning.innerHTML = html;
          symptomSimilarWarning.querySelectorAll("[data-pick-symptom-similar]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              titleInput.value = btn.getAttribute("data-pick-symptom-similar");
              symptomJustPicked = true;
              symptomDropdownList.innerHTML = "";
              symptomSimilarWarning.innerHTML = "";
              refreshSubmitState();
            });
          });
        }

        titleInput.addEventListener("input", function () {
          symptomJustPicked = false;
          renderSymptomDropdown();
          renderSimilarWarning();
        });
        titleInput.addEventListener("blur", function () {
          // Delay so a click on a dropdown item (which fires blur first) still registers.
          setTimeout(function () { symptomDropdownList.innerHTML = ""; }, 150);
        });
        titleInput.addEventListener("focus", function () {
          if (titleInput.value.trim()) renderSymptomDropdown();
        });

        // If editing/duplicating with a pre-filled value, run the similarity
        // check once so a pre-filled near-duplicate still surfaces.
        if (titleInput.value.trim()) renderSimilarWarning();
      }

      // severity chips
      var selectedSeverity = editEntry && editEntry.severity ? editEntry.severity : 1;
      var severityRow = document.getElementById("severity-row");
      if (severityRow) {
        severityRow.querySelectorAll("[data-severity]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            selectedSeverity = parseInt(btn.getAttribute("data-severity"), 10);
            severityRow.querySelectorAll("[data-severity]").forEach(function (b) { b.classList.remove("active"); });
            btn.classList.add("active");
          });
        });
      }

      // toilet type chips
      var selectedToiletType = (editEntry && editEntry.subtype) ? editEntry.subtype : "mocenie";
      var toiletRow = document.getElementById("toilet-type-row");
      var bristolWrap = document.getElementById("bristol-wrap");
      function updateBristolVisibility() {
        if (bristolWrap) bristolWrap.style.display = selectedToiletType === "stolica" ? "block" : "none";
      }
      if (toiletRow) {
        toiletRow.querySelectorAll("[data-toilet-type]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            selectedToiletType = btn.getAttribute("data-toilet-type");
            toiletRow.querySelectorAll("[data-toilet-type]").forEach(function (b) { b.classList.remove("active"); b.style.background = ""; });
            btn.classList.add("active");
            btn.style.background = TYPE_META.vylucovanie.bg;
            updateBristolVisibility();
          });
        });
      }

      // bristol chips
      var selectedBristol = (editEntry && editEntry.bristol) ? editEntry.bristol : null;
      var bristolGrid = document.getElementById("bristol-grid");
      if (bristolGrid) {
        bristolGrid.querySelectorAll("[data-bristol]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            selectedBristol = parseInt(btn.getAttribute("data-bristol"), 10);
            bristolGrid.querySelectorAll("[data-bristol]").forEach(function (b) { b.classList.remove("active"); });
            btn.classList.add("active");
          });
        });
      }

      // category chips + custom category input
      var selectedCategory = null;
      var categoryRow = document.getElementById("category-chip-row");
      var customCategoryInput = document.getElementById("field-custom-category");
      if (categoryRow) {
        var chipButtons = categoryRow.querySelectorAll("[data-category]");
        var activeChip = categoryRow.querySelector("[data-category].active");
        if (activeChip) {
          var activeVal = activeChip.getAttribute("data-category");
          selectedCategory = (activeVal === "Iné" && customCategoryInput && customCategoryInput.value.trim()) ? null : activeVal;
        } else {
          selectedCategory = chipButtons.length ? chipButtons[0].getAttribute("data-category") : null;
        }
        chipButtons.forEach(function (btn) {
          btn.addEventListener("click", function () {
            var val = btn.getAttribute("data-category");
            chipButtons.forEach(function (b) { b.classList.remove("active"); b.style.background = ""; });
            btn.classList.add("active");
            btn.style.background = TYPE_META[type].bg;
            if (val === "Iné") {
              selectedCategory = null;
              customCategoryInput.style.display = "block";
              customCategoryInput.focus();
            } else {
              selectedCategory = val;
              customCategoryInput.style.display = "none";
            }
          });
        });
      }

      var form = document.getElementById("entry-form");
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();

        var data = { type: type };
        var timeEl = document.getElementById("field-time");
        data.time = (timeEl && timeEl.value) || nowHM();
        var dateEl = document.getElementById("field-date");
        if (dateEl && dateEl.value) data.date = dateEl.value;

        if (type === "vylucovanie") {
          var toiletMeta = TOILET_TYPES.find(function (t) { return t.v === selectedToiletType; });
          data.subtype = selectedToiletType;
          data.title = toiletMeta ? toiletMeta.label : "Toaleta";
          data.bristol = (selectedToiletType === "stolica" && selectedBristol) ? selectedBristol : undefined;
        } else {
          var title = titleInput ? titleInput.value.trim() : "";
          if (!title) return;
          data.title = title;
        }

        if (type === "jedlo" || type === "aktivita" || type === "tekutina") {
          var finalCategory = selectedCategory;
          if (!finalCategory && customCategoryInput && customCategoryInput.value.trim()) {
            finalCategory = customCategoryInput.value.trim();
            addCustomCategory(type, finalCategory);
          }
          data.category = finalCategory || "Iné";
        }

        if (type === "symptom") data.severity = selectedSeverity;

        if (type === "tekutina") {
          var amountEl = document.getElementById("field-amount");
          data.amount = (amountEl && amountEl.value) ? parseInt(amountEl.value, 10) : undefined;
        }
        if (type === "liek") {
          var doseEl = document.getElementById("field-dose");
          data.dose = (doseEl && doseEl.value.trim()) ? doseEl.value.trim() : undefined;
        }

        if (type === "aktivita") {
          var endTimeEl = document.getElementById("field-endtime");
          if (endTimeEl) data.endTime = endTimeEl.value || undefined;
        }

        var noteEl = document.getElementById("field-note");
        var note = noteEl ? noteEl.value.trim() : "";
        data.note = note || undefined;

        state.modal = null;
        if (isRealEdit) {
          updateEntry(editEntry.id, data);
          state.editId = null;
        } else {
          state.duplicateSeed = null;
          if (data.date) state.selectedDate = data.date;
          addEntry(data);
        }
      });
    }

    // link modal
    var linkOverlay = document.getElementById("link-modal-overlay");
    if (linkOverlay) {
      linkOverlay.addEventListener("click", function (ev) { if (ev.target === linkOverlay) { state.linkTarget = null; render(); } });
      var linkClose = document.getElementById("link-modal-close");
      if (linkClose) linkClose.onclick = function () { state.linkTarget = null; render(); };
      linkOverlay.querySelectorAll("[data-link-select]").forEach(function (el) {
        el.addEventListener("click", function () { linkSymptomTo(state.linkTarget, el.getAttribute("data-link-select")); });
      });
    }
  }

  function focusModalTitle() {
    setTimeout(function () {
      var el = document.getElementById("field-title");
      if (el) el.focus();
    }, 0);
  }

  applyTheme(state.theme);
  render();
})();
</script>
</body>
</html>
