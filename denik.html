<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Denník</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F7F5F0" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Denník" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #F7F5F0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #2B2B26;
  }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  ::selection { background: #E6D9C7; }
  select:focus, input:focus, textarea:focus, button:focus { outline: none; }

  #app { min-height: 100vh; background: #F7F5F0; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 120px; }

  header { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { font-size: 30px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; font-size: 14px; color: #8A8478; }
  .icon-btn { background: none; border: 1px solid #E3DDD0; border-radius: 8px; padding: 8px; color: #8A8478; }
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .import-confirm { font-size: 13px; color: #5A5548; margin: 0 0 16px; line-height: 1.5; }
  .import-choice { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .import-choice button { width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid #E3DDD0; background: transparent; }
  .import-choice button .opt-title { font-size: 14px; font-weight: 600; display: block; }
  .import-choice button .opt-sub { font-size: 12px; color: #8A8478; display: block; margin-top: 2px; }
  .import-choice button.merge { border-color: #5C7A6B; }
  .import-choice button.merge .opt-title { color: #5C7A6B; }
  .import-choice button.replace .opt-title { color: #B0472E; }
  .import-choice button.replace { border-color: #B0472E; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #2B2B26; color: #FCFBF8; font-size: 13px; padding: 10px 18px; border-radius: 20px; z-index: 60; max-width: 80vw; text-align: center; }

  .datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .datenav button { background: none; border: none; font-size: 20px; color: #8A6B4F; padding: 4px 10px; }
  .datenav-center { text-align: center; }
  .datenav-day { font-size: 17px; font-weight: 600; text-transform: capitalize; }
  .datenav select { appearance: none; border: none; background: transparent; font-size: 12px; color: #8A8478; text-align: center; }

  .error-banner { background: #F7E4DE; color: #8A3420; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }

  .empty { text-align: center; padding: 60px 20px; color: #A39D8F; }
  .empty p:first-child { font-size: 16px; margin: 0; }
  .empty p:last-child { font-size: 13px; margin-top: 6px; }

  .timeline { position: relative; }
  .timeline-line { position: absolute; left: 15px; top: 6px; bottom: 6px; width: 1px; background: #E3DDD0; }

  .row { display: flex; gap: 14px; margin-bottom: 14px; position: relative; }
  .row-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 1; border: 2px solid #F7F5F0; }
  .row-dot.ongoing { box-shadow: 0 0 0 3px rgba(92,122,107,0.25); }
  .row-card { flex: 1; background: #FCFBF8; border: 1px solid #EBE5D8; border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; }
  .row-time { font-size: 11px; color: #A39D8F; font-weight: 500; }
  .row-cat { font-size: 11px; font-weight: 600; margin-left: 8px; }
  .row-title { font-size: 15px; margin-top: 3px; font-weight: 500; }
  .row-sub { font-size: 12px; color: #8A8478; margin-top: 2px; }
  .row-linked { font-size: 12px; color: #8A8478; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  .row-ongoing-badge { font-size: 11px; color: #5C7A6B; font-weight: 600; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  .row-ongoing-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #5C7A6B; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .row-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid #EBE5D8; display: none; }
  .row-detail.open { display: block; }
  .row-note { font-size: 13px; color: #5A5548; margin: 0 0 10px; line-height: 1.5; }
  .row-actions { display: flex; gap: 14px; flex-wrap: wrap; }
  .row-actions button { background: none; border: none; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; padding: 0; }
  .chevron { transition: transform 0.15s; display: inline-flex; }
  .chevron.open { transform: rotate(180deg); }

  .actionbar { position: fixed; bottom: 0; left: 0; right: 0; background: #FCFBF8; border-top: 1px solid #E3DDD0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); }
  .actionbar-inner { max-width: 640px; margin: 0 auto; }
  .fab-add { width: 100%; padding: 14px 0; border: none; border-radius: 12px; background: #2B2B26; color: #FCFBF8; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }

  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  .type-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px 8px; border: none; border-radius: 12px; text-align: center; }
  .type-btn span { font-size: 13px; font-weight: 600; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(43,43,38,0.4); display: flex; align-items: flex-end; z-index: 50; }
  .modal-sheet { background: #FCFBF8; width: 100%; border-radius: 18px 18px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; max-height: 85vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-title-wrap { display: flex; align-items: center; gap: 8px; }
  .modal-icon-badge { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .modal-title { font-size: 17px; font-weight: 600; }
  .modal-close { background: none; border: none; color: #A39D8F; flex-shrink: 0; }

  .field-title { width: 100%; font-size: 16px; padding: 10px 0; border: none; border-bottom: 1px solid #E3DDD0; margin-bottom: 14px; background: transparent; }
  .field-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .field-col { flex: 1; }
  .field-col.wide { flex: 1.4; }
  .field-label { font-size: 11px; color: #A39D8F; display: block; margin-bottom: 4px; }
  .time-input-wrap { display: flex; align-items: center; gap: 6px; border: 1px solid #E3DDD0; border-radius: 8px; padding: 8px 10px; }
  .time-input-wrap input { border: none; background: transparent; font-size: 14px; width: 100%; }
  .field-select { border: 1px solid #E3DDD0; border-radius: 8px; padding: 8px 10px; font-size: 14px; width: 100%; background: transparent; }
  .field-input { border: 1px solid #E3DDD0; border-radius: 8px; padding: 8px 10px; font-size: 14px; width: 100%; background: transparent; }

  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip-btn { padding: 7px 12px; border-radius: 20px; border: 1px solid #E3DDD0; background: transparent; color: #8A8478; font-size: 13px; }
  .chip-btn.active { border-width: 1.5px; border-color: currentColor; font-weight: 600; }

  .severity-row { display: flex; gap: 8px; }
  .severity-btn { flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid #E3DDD0; background: transparent; color: #8A8478; font-size: 13px; }
  .severity-btn.active { border: 1.5px solid #B0472E; background: #F7E4DE; color: #B0472E; font-weight: 600; }

  .bristol-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
  .bristol-btn { padding: 8px 4px; border-radius: 8px; border: 1px solid #E3DDD0; background: transparent; color: #5A5548; font-size: 11px; line-height: 1.3; text-align: center; }
  .bristol-btn b { display: block; font-size: 15px; }
  .bristol-btn.active { border: 1.5px solid #8A6B4F; background: #F1E9DF; color: #8A6B4F; font-weight: 600; }

  .field-note { width: 100%; border: 1px solid #E3DDD0; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; resize: none; }
  .submit-btn { width: 100%; padding: 13px 0; border-radius: 10px; border: none; color: #FCFBF8; font-size: 15px; font-weight: 600; }
  .submit-btn:disabled { background: #DDD6C7 !important; }
  .field-hint { font-size: 11px; color: #A39D8F; margin: -8px 0 14px; }

  .link-list-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 4px; border: none; border-bottom: 1px solid #EBE5D8; background: transparent; text-align: left; }
  .link-list-icon { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .link-list-time { font-size: 11px; color: #A39D8F; }
  .link-list-title { font-size: 14px; }

  /* Tab navigation */
  .tabnav { display: flex; gap: 6px; background: #EFEAE0; border-radius: 10px; padding: 4px; margin-bottom: 22px; }
  .tabnav button { flex: 1; padding: 9px 0; border: none; border-radius: 8px; background: transparent; color: #8A8478; font-size: 13px; font-weight: 600; }
  .tabnav button.active { background: #FCFBF8; color: #2B2B26; box-shadow: 0 1px 2px rgba(43,43,38,0.08); }

  /* Weight card */
  .weight-card { background: #FCFBF8; border: 1px solid #EBE5D8; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .weight-card-left { display: flex; align-items: center; gap: 10px; }
  .weight-icon-badge { width: 34px; height: 34px; border-radius: 50%; background: #F1E9DF; color: #8A6B4F; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .weight-value { font-size: 19px; font-weight: 600; font-family: Georgia, serif; }
  .weight-label { font-size: 11px; color: #A39D8F; }
  .weight-delta { font-size: 12px; font-weight: 600; margin-left: 6px; }
  .weight-delta.down { color: #5C7A6B; }
  .weight-delta.up { color: #B0472E; }
  .weight-edit-btn { background: #F1E9DF; color: #8A6B4F; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; }

  /* Stats screen */
  .stat-section { margin-bottom: 28px; }
  .stat-section-title { font-size: 15px; font-weight: 600; margin: 0 0 12px; font-family: Georgia, serif; }
  .stat-empty { font-size: 13px; color: #A39D8F; padding: 16px 0; text-align: center; }
  .range-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .range-tabs button { padding: 6px 14px; border-radius: 16px; border: 1px solid #E3DDD0; background: transparent; color: #8A8478; font-size: 12px; }
  .range-tabs button.active { background: #2B2B26; color: #FCFBF8; border-color: #2B2B26; font-weight: 600; }

  .chart-wrap { background: #FCFBF8; border: 1px solid #EBE5D8; border-radius: 12px; padding: 16px; }
  .weight-chart-svg { width: 100%; height: auto; display: block; }

  .link-stat-item { background: #FCFBF8; border: 1px solid #EBE5D8; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .link-stat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .link-stat-symptom { font-size: 14px; font-weight: 600; color: #B0472E; }
  .link-stat-count { font-size: 11px; color: #A39D8F; }
  .link-stat-food { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13px; }
  .link-stat-food-name { color: #5A5548; }
  .link-stat-bar-wrap { flex: 1; margin: 0 10px; height: 6px; background: #EFEAE0; border-radius: 3px; overflow: hidden; }
  .link-stat-bar { height: 100%; background: #B0472E; border-radius: 3px; }
  .link-stat-food-count { font-size: 12px; color: #A39D8F; font-weight: 600; min-width: 18px; text-align: right; }

  .freq-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .freq-bar-label { font-size: 12px; color: #8A8478; width: 70px; flex-shrink: 0; }
  .freq-bar-track { flex: 1; height: 18px; background: #EFEAE0; border-radius: 4px; overflow: hidden; position: relative; }
  .freq-bar-fill { height: 100%; border-radius: 4px; }
  .freq-bar-count { font-size: 11px; color: #A39D8F; width: 20px; text-align: right; flex-shrink: 0; }

  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .summary-tile { background: #FCFBF8; border: 1px solid #EBE5D8; border-radius: 10px; padding: 14px; }
  .summary-tile-value { font-size: 20px; font-weight: 600; font-family: Georgia, serif; }
  .summary-tile-label { font-size: 11px; color: #A39D8F; margin-top: 2px; }

  .ai-export-textarea { width: 100%; height: 240px; border: 1px solid #E3DDD0; border-radius: 8px; padding: 10px 12px; font-size: 11.5px; font-family: ui-monospace, "SF Mono", Consolas, monospace; line-height: 1.5; resize: vertical; margin-bottom: 14px; background: #FCFBF8; color: #2B2B26; }
  .ai-export-actions { display: flex; gap: 8px; }
  .ai-export-actions button { flex: 1; }
  .copy-btn-secondary { background: #EFEAE0; color: #5A5548; border: none; border-radius: 10px; padding: 13px 0; font-size: 14px; font-weight: 600; }

  /* Title suggestions */
  .suggest-row { display: flex; gap: 8px; flex-wrap: wrap; margin: -8px 0 14px; }
  .suggest-chip { padding: 6px 12px; border-radius: 16px; border: 1px solid #E3DDD0; background: #F7F5F0; color: #5A5548; font-size: 12px; }

  .symptom-dropdown-wrap { position: relative; margin-bottom: 14px; }
  .symptom-dropdown-list { position: absolute; top: 100%; left: 0; right: 0; background: #FCFBF8; border: 1px solid #E3DDD0; border-top: none; border-radius: 0 0 10px 10px; max-height: 180px; overflow-y: auto; z-index: 5; box-shadow: 0 4px 10px rgba(43,43,38,0.08); }
  .symptom-dropdown-item { width: 100%; text-align: left; padding: 10px 14px; border: none; background: transparent; font-size: 14px; color: #2B2B26; border-bottom: 1px solid #F0EBE0; display: flex; justify-content: space-between; align-items: center; }
  .symptom-dropdown-item:last-child { border-bottom: none; }
  .symptom-dropdown-item .count-badge { font-size: 11px; color: #A39D8F; }
  .symptom-dropdown-add { width: 100%; text-align: left; padding: 10px 14px; border: none; background: transparent; font-size: 14px; color: #B0472E; font-weight: 600; }
  .symptom-similar-warning { background: #FBF3EC; border: 1px solid #E8D5BE; border-radius: 8px; padding: 10px 12px; margin: -6px 0 14px; }
  .symptom-similar-warning p { font-size: 12px; color: #8A6B4F; margin: 0 0 8px; line-height: 1.4; }
  .symptom-similar-item { display: inline-block; padding: 5px 10px; border-radius: 14px; border: 1px solid #D9C4A8; background: #FCFBF8; color: #5A5548; font-size: 12px; margin: 0 6px 6px 0; }

  /* Print export */
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible !important; }
    #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
  }
  #print-area { display: none; }
  #print-area.active { display: block; padding: 20px; font-family: Georgia, serif; color: #1a1a1a; max-width: 800px; margin: 0 auto; }
  #print-area h1 { font-size: 22px; margin-bottom: 4px; }
  #print-area .print-meta { font-size: 12px; color: #666; margin-bottom: 20px; font-family: -apple-system, sans-serif; }
  #print-area .print-day { margin-bottom: 22px; page-break-inside: avoid; }
  #print-area .print-day-title { font-size: 15px; font-weight: 700; border-bottom: 1.5px solid #333; padding-bottom: 4px; margin-bottom: 8px; text-transform: capitalize; }
  #print-area .print-row { font-size: 12.5px; padding: 3px 0; display: flex; gap: 8px; font-family: -apple-system, sans-serif; }
  #print-area .print-row .p-time { color: #666; width: 42px; flex-shrink: 0; }
  #print-area .print-row .p-type { width: 78px; flex-shrink: 0; font-weight: 600; }
  #print-area .print-row .p-body { flex: 1; }
  #print-area .print-row .p-note { color: #666; font-style: italic; }

  /* ============ DARK THEME ============
     Overrides neutral surface/text/border colors only. Type-accent colors
     (food brown, symptom red, activity green, etc.) are left unchanged —
     they read fine against a dark background without adjustment. */
  html[data-theme="dark"] { color-scheme: dark; }
  html[data-theme="dark"], html[data-theme="dark"] body { background: #171511; }
  html[data-theme="dark"] body { color: #EDE9E2; }
  html[data-theme="dark"] #app { background: #171511; }
  html[data-theme="dark"] ::selection { background: #4A3F2E; }

  html[data-theme="dark"] header p { color: #9B948A; }
  html[data-theme="dark"] .icon-btn { border-color: #3A362F; color: #9B948A; }

  html[data-theme="dark"] .import-confirm { color: #C9C3B8; }
  html[data-theme="dark"] .import-choice button { border-color: #3A362F; }
  html[data-theme="dark"] .import-choice button .opt-sub { color: #9B948A; }
  html[data-theme="dark"] .toast { background: #EDE9E2; color: #171511; }

  html[data-theme="dark"] .datenav select,
  html[data-theme="dark"] .datenav-center .datenav-day { color: #EDE9E2; }
  html[data-theme="dark"] .datenav select { color: #9B948A; }

  html[data-theme="dark"] .error-banner { background: #3A241C; color: #E8A491; }

  html[data-theme="dark"] .empty { color: #9B948A; }

  html[data-theme="dark"] .timeline-line { background: #3A362F; }
  html[data-theme="dark"] .row-dot { border-color: #171511; }
  html[data-theme="dark"] .row-card { background: #221F1A; border-color: #3A362F; }
  html[data-theme="dark"] .row-time,
  html[data-theme="dark"] .row-sub,
  html[data-theme="dark"] .row-linked { color: #9B948A; }
  html[data-theme="dark"] .row-detail { border-color: #3A362F; }
  html[data-theme="dark"] .row-note { color: #C9C3B8; }
  html[data-theme="dark"] .chevron svg { stroke: #6B655A; }

  html[data-theme="dark"] .actionbar { background: #1D1B16; border-color: #3A362F; }
  html[data-theme="dark"] .fab-add { background: #EDE9E2; color: #171511; }

  html[data-theme="dark"] .modal-overlay { background: rgba(0,0,0,0.6); }
  html[data-theme="dark"] .modal-sheet { background: #1D1B16; }
  html[data-theme="dark"] .modal-close { color: #9B948A; }

  html[data-theme="dark"] .field-title,
  html[data-theme="dark"] .field-select,
  html[data-theme="dark"] .field-input,
  html[data-theme="dark"] .field-note,
  html[data-theme="dark"] .time-input-wrap input { color: #EDE9E2; }
  html[data-theme="dark"] .field-title { border-color: #3A362F; }
  html[data-theme="dark"] .field-label { color: #9B948A; }
  html[data-theme="dark"] .time-input-wrap,
  html[data-theme="dark"] .field-select,
  html[data-theme="dark"] .field-input,
  html[data-theme="dark"] .field-note { border-color: #3A362F; }
  html[data-theme="dark"] .field-hint { color: #9B948A; }

  html[data-theme="dark"] .chip-btn { border-color: #3A362F; color: #9B948A; }
  html[data-theme="dark"] .severity-btn { border-color: #3A362F; color: #9B948A; }
  html[data-theme="dark"] .bristol-btn { border-color: #3A362F; color: #C9C3B8; }

  html[data-theme="dark"] .submit-btn:disabled { background: #3A362F !important; color: #6B655A; }

  html[data-theme="dark"] .link-list-item { border-color: #2A2721; }

  html[data-theme="dark"] .tabnav { background: #221F1A; }
  html[data-theme="dark"] .tabnav button { color: #9B948A; }
  html[data-theme="dark"] .tabnav button.active { background: #1D1B16; color: #EDE9E2; }

  html[data-theme="dark"] .weight-card { background: #221F1A; border-color: #3A362F; }
  html[data-theme="dark"] .weight-label { color: #9B948A; }

  html[data-theme="dark"] .stat-empty { color: #9B948A; }
  html[data-theme="dark"] .range-tabs button { border-color: #3A362F; color: #9B948A; }
  html[data-theme="dark"] .range-tabs button.active { background: #EDE9E2; color: #171511; border-color: #EDE9E2; }
  html[data-theme="dark"] .chart-wrap { background: #221F1A; border-color: #3A362F; }
  html[data-theme="dark"] .link-stat-item { background: #221F1A; border-color: #3A362F; }
  html[data-theme="dark"] .link-stat-count { color: #9B948A; }

<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  // Bump this string with each meaningful change, so it's easy to confirm
  // on-device whether the latest version has actually been uploaded/loaded.
  // Shown small in the header, and included in print/AI export headers too.
  var APP_VERSION = "1.7.1 (2026-09-12)";

  // ---------- config: category lists (mutable — user can extend) ----------
  var DEFAULT_CATEGORIES = {
    jedlo: ["Raňajky", "Desiata", "Obed", "Olovrant", "Večera", "Iné"],
    aktivita: ["Cvičenie", "Sedenie", "Meditácia", "Chôdza", "Spánok", "Iné"],
    tekutina: ["Voda", "Káva", "Čaj", "Džús", "Iné"]
  };
  var SEVERITY = [
    { v: 1, label: "Mierne" },
    { v: 2, label: "Stredné" },
    { v: 3, label: "Silné" }
  ];
  var BRISTOL = [
    { v: 1, label: "Hrudky", desc: "tvrdé" },
    { v: 2, label: "Hrudkovitá", desc: "tvrdšia" },
    { v: 3, label: "Praskliny", desc: "normálna" },
    { v: 4, label: "Hladká", desc: "ideálna" },
    { v: 5, label: "Mäkké kúsky", desc: "mäkšia" },
    { v: 6, label: "Kašovitá", desc: "riedka" },
    { v: 7, label: "Vodnatá", desc: "hnačka" }
  ];
  var TOILET_TYPES = [
    { v: "mocenie", label: "Močenie" },
    { v: "stolica", label: "Stolica" }
  ];

  var STORAGE_KEY = "denik_entries_v1";
  var CATEGORIES_KEY = "denik_categories_v1";
  var WEIGHT_KEY = "denik_weight_v1"; // { "YYYY-MM-DD": kg, ... }
  var THEME_KEY = "denik_theme_v1"; // "light" | "dark"

  // ---------- icons ----------
  function svgWrap(inner, size, color, sw) {
    size = size || 16; color = color || "currentColor"; sw = sw || 2;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }
  function iconMeal(size, color) { return svgWrap('<path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>', size, color); }
  function iconSymptom(size, color) { return svgWrap('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>', size, color); }
  function iconActivity(size, color) { return svgWrap('<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>', size, color); }
  function iconToilet(size, color) { return svgWrap('<path d="M7 3h10a1 1 0 0 1 1 1v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5V4a1 1 0 0 1 1-1Z"/><path d="M9 15v2a3 3 0 0 0 6 0v-2"/><line x1="5" y1="21" x2="19" y2="21"/>', size, color); }
  function iconDroplet(size, color) { return svgWrap('<path d="M12 2c4 5 7 9.5 7 13a7 7 0 0 1-14 0c0-3.5 3-8 7-13Z"/>', size, color); }
  function iconPill(size, color) { return svgWrap('<rect x="3" y="10.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"/><line x1="9" y1="15" x2="15" y2="9"/>', size, color); }
  function iconClock(size, color) { return svgWrap('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', size, color); }
  function iconX(size, color) { return svgWrap('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>', size, color); }
  function iconChevron(size, color) { return svgWrap('<polyline points="6 9 12 15 18 9"/>', size, color); }
  function iconTrash(size, color) { return svgWrap('<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>', size, color); }
  function iconLink(size, color) { return svgWrap('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>', size, color); }
  function iconDownload(size, color) { return svgWrap('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>', size, color); }
  function iconUpload(size, color) { return svgWrap('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>', size, color); }
  function iconStop(size, color) { return svgWrap('<rect x="6" y="6" width="12" height="12" rx="2"/>', size, color); }
  function iconPlus(size, color) { return svgWrap('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', size, color); }
  function iconEdit(size, color) { return svgWrap('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>', size, color); }
  function iconWeight(size, color) { return svgWrap('<rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M12 13.5 L15 9.5"/><circle cx="12" cy="13.5" r="1"/>', size, color); }
  function iconStats(size, color) { return svgWrap('<line x1="4" y1="20" x2="4" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="20" y1="20" x2="20" y2="14"/>', size, color); }
  function iconSun(size, color) { return svgWrap('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>', size, color); }
  function iconMoon(size, color) { return svgWrap('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>', size, color); }
  function iconCopy(size, color) { return svgWrap('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>', size, color); }
  function iconPrinter(size, color) { return svgWrap('<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>', size, color); }
  function iconSparkles(size, color) { return svgWrap('<path d="M12 3v4M12 17v4M5 5l2.5 2.5M16.5 16.5L19 19M3 12h4M17 12h4M5 19l2.5-2.5M16.5 7.5L19 5"/><circle cx="12" cy="12" r="2"/>', size, color); }

  var TYPE_META = {
    jedlo: { label: "Jedlo", color: "#8A6B4F", bg: "#F1E9DF", svg: iconMeal },
    symptom: { label: "Symptóm", color: "#B0472E", bg: "#F7E4DE", svg: iconSymptom },
    aktivita: { label: "Aktivita", color: "#5C7A6B", bg: "#E6EEE9", svg: iconActivity },
    vylucovanie: { label: "Toaleta", color: "#A3792F", bg: "#F3E9D6", svg: iconToilet },
    tekutina: { label: "Tekutiny", color: "#3E7A8C", bg: "#DFEEF2", svg: iconDroplet },
    liek: { label: "Liek/doplnok", color: "#7A5C9E", bg: "#EAE2F2", svg: iconPill }
  };
  var TYPE_ORDER = ["jedlo", "symptom", "aktivita", "vylucovanie", "tekutina", "liek"];

  // ---------- state ----------
  var state = {
    entries: loadEntries(),
    categories: loadCategories(),
    weights: loadWeights(), // { "YYYY-MM-DD": number }
    view: "denik",        // 'denik' | 'statistiky'
    statsRange: 30,        // days for weight chart
    weightEditOpen: false,
    selectedDate: todayISO(),
    typePicker: false,   // show the 6-type grid
    modal: null,         // which type's form is open
    editId: null,        // id of entry being edited (null = creating new)
    duplicateSeed: null, // entry object to prefill a NEW entry from (duplicate), without editing the original
    linkTarget: null,
    error: null,
    openRows: {},
    pendingImport: null,
    toast: null,
    printModalOpen: false,
    printRange: 7, // days back to include (used when printRangeMode === "preset")
    printRangeMode: "preset", // "preset" | "custom"
    printCustomFrom: null,
    printCustomTo: null,
    theme: loadTheme(),
    aiExportModalOpen: false,
    aiExportRange: 30
  };

  // ---------- storage ----------
  function loadEntries() {
    try { var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
    catch (e) { return []; }
  }
  function saveEntries() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.entries)); state.error = null; }
    catch (e) { state.error = "Uloženie sa nepodarilo (pamäť prehliadača môže byť plná)."; }
  }
  function loadCategories() {
    try {
      var raw = localStorage.getItem(CATEGORIES_KEY);
      var stored = raw ? JSON.parse(raw) : {};
      var merged = {};
      Object.keys(DEFAULT_CATEGORIES).forEach(function (k) {
        var extra = (stored[k] || []).filter(function (c) { return DEFAULT_CATEGORIES[k].indexOf(c) === -1; });
        merged[k] = DEFAULT_CATEGORIES[k].slice(0, -1).concat(extra, ["Iné"]);
      });
      return merged;
    } catch (e) {
      var fallback = {};
      Object.keys(DEFAULT_CATEGORIES).forEach(function (k) { fallback[k] = DEFAULT_CATEGORIES[k].slice(); });
      return fallback;
    }
  }
  function saveCategories() {
    try {
      var toStore = {};
      Object.keys(state.categories).forEach(function (k) {
        toStore[k] = state.categories[k].filter(function (c) { return DEFAULT_CATEGORIES[k].indexOf(c) === -1; });
      });
      localStorage.setItem(CATEGORIES_KEY, JSON.stringify(toStore));
    } catch (e) { /* non-critical */ }
  }
  function addCustomCategory(group, name) {
    name = name.trim();
    if (!name) return;
    if (state.categories[group].indexOf(name) === -1) {
      state.categories[group].splice(state.categories[group].length - 1, 0, name);
      saveCategories();
    }
  }
  function loadTheme() {
    try {
      var stored = localStorage.getItem(THEME_KEY);
      if (stored === "dark" || stored === "light") return stored;
    } catch (e) { /* fall through to system preference */ }
    // No stored preference yet: default to the system's color-scheme setting.
    try {
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
    } catch (e) { /* ignore */ }
    return "light";
  }
  function saveTheme(theme) {
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* non-critical */ }
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    var themeColorMeta = document.querySelector('meta[name="theme-color"]');
    if (themeColorMeta) themeColorMeta.setAttribute("content", theme === "dark" ? "#1E1C18" : "#F7F5F0");
  }
  function toggleTheme() {
    state.theme = state.theme === "dark" ? "light" : "dark";
    saveTheme(state.theme);
    applyTheme(state.theme);
    render();
  }

  function loadWeights() {
    try { var raw = localStorage.getItem(WEIGHT_KEY); return raw ? JSON.parse(raw) : {}; }
    catch (e) { return {}; }
  }
  function saveWeights() {
    try { localStorage.setItem(WEIGHT_KEY, JSON.stringify(state.weights)); }
    catch (e) { state.error = "Uloženie hmotnosti sa nepodarilo."; }
  }
  function setWeightForDate(date, kg) {
    if (kg === null || kg === undefined || isNaN(kg)) {
      delete state.weights[date];
    } else {
      state.weights[date] = kg;
    }
    saveWeights();
    render();
  }
  function getSortedWeightDates() {
    return Object.keys(state.weights).sort();
  }
  function getLastWeightEntry() {
    var dates = getSortedWeightDates();
    if (!dates.length) return null;
    var last = dates[dates.length - 1];
    return { date: last, kg: state.weights[last] };
  }
  function getPreviousWeightEntry(beforeDate) {
    var dates = getSortedWeightDates().filter(function (d) { return d < beforeDate; });
    if (!dates.length) return null;
    var prev = dates[dates.length - 1];
    return { date: prev, kg: state.weights[prev] };
  }

  // Suggestions: most frequent + most recent titles for a given type, deduplicated (case-insensitive), capped.
  function getTitleSuggestions(type, limit) {
    limit = limit || 6;
    var relevant = state.entries.filter(function (e) { return e.type === type && e.title; });
    if (relevant.length === 0) return [];

    var stats = {}; // lowercase key -> { label, count, lastDate, lastTime }
    relevant.forEach(function (e) {
      var key = e.title.trim().toLowerCase();
      if (!key) return;
      if (!stats[key]) stats[key] = { label: e.title.trim(), count: 0, lastSort: "" };
      stats[key].count++;
      var sortKey = e.date + " " + (e.time || "");
      if (sortKey > stats[key].lastSort) { stats[key].lastSort = sortKey; stats[key].label = e.title.trim(); }
    });

    var list = Object.keys(stats).map(function (k) { return stats[k]; });
    // score: recent items get a boost so a just-used new title still surfaces, but frequency dominates over time
    list.sort(function (a, b) {
      if (b.count !== a.count) return b.count - a.count;
      return b.lastSort < a.lastSort ? -1 : 1;
    });
    return list.slice(0, limit).map(function (x) { return x.label; });
  }

  // Returns every distinct title ever used for a given type, sorted by
  // frequency (most-used first). Used to power the searchable symptom
  // "database" dropdown — unlike getTitleSuggestions this has no limit,
  // since the whole point is to let the person browse/search everything
  // they've ever recorded, not just the top few.
  function getAllDistinctTitles(type) {
    var relevant = state.entries.filter(function (e) { return e.type === type && e.title; });
    var stats = {};
    relevant.forEach(function (e) {
      var key = e.title.trim().toLowerCase();
      if (!key) return;
      if (!stats[key]) stats[key] = { label: e.title.trim(), count: 0 };
      stats[key].count++;
    });
    var list = Object.keys(stats).map(function (k) { return stats[k]; });
    list.sort(function (a, b) { return b.count - a.count; });
    return list.map(function (x) { return x.label; });
  }

  // Slovak stopwords excluded when comparing titles for similarity — common
  // short words like prepositions/pronouns that would otherwise cause
  // unrelated symptoms to look similar just because they share "v", "na", etc.
  var SIMILARITY_STOPWORDS = ["v", "na", "s", "so", "a", "aj", "je", "som", "mi", "mu", "jej",
    "pri", "po", "za", "do", "od", "pre", "bez", "cez", "pod", "nad", "medzi", "ako", "ale", "alebo", "to", "ten", "tá", "tie"];

  // Breaks a title into lowercase word "tokens" for similarity comparison,
  // stripping punctuation and short stopwords. Deliberately simple (no
  // stemming/fuzzy matching) so behavior stays predictable and explainable.
  function tokenizeForSimilarity(text) {
    return text
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, function (m) { return m; }) // keep diacritics as-is; normalize is a no-op safeguard here
      .replace(/[^\p{L}\p{N}\s]/gu, " ")
      .split(/\s+/)
      .filter(function (w) { return w.length >= 3 && SIMILARITY_STOPWORDS.indexOf(w) === -1; });
  }

  // Finds existing titles (for the given type) that share at least one
  // meaningful word with newTitle — e.g. "pichanie v podrebrí vpravo" and
  // "pichanie v pravom podrebrí" both contain "pichanie" and "podrebrí".
  // Returns matches sorted by number of shared words (most overlap first),
  // excluding an exact case-insensitive match (that's not "similar", it's
  // the same thing) and excluding newTitle itself if already in the list.
  function findSimilarTitles(newTitle, type, limit) {
    limit = limit || 5;
    var newTokens = tokenizeForSimilarity(newTitle);
    if (newTokens.length === 0) return [];
    var newKey = newTitle.trim().toLowerCase();

    var existing = getAllDistinctTitles(type);
    var scored = [];
    existing.forEach(function (title) {
      if (title.trim().toLowerCase() === newKey) return; // exact match isn't "similar", handled separately
      var tokens = tokenizeForSimilarity(title);
      var shared = tokens.filter(function (t) { return newTokens.indexOf(t) !== -1; });
      if (shared.length > 0) scored.push({ title: title, shared: shared.length });
    });
    scored.sort(function (a, b) { return b.shared - a.shared; });
    return scored.slice(0, limit).map(function (x) { return x.title; });
  }

  // ---------- helpers ----------
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function todayISO() {
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }
  function nowHM() {
    var d = new Date();
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function formatDateHuman(iso) {
    var d = new Date(iso + "T00:00:00");
    var days = ["nedeľa","pondelok","utorok","streda","štvrtok","piatok","sobota"];
    var months = ["januára","februára","marca","apríla","mája","júna","júla","augusta","septembra","októbra","novembra","decembra"];
    return days[d.getDay()] + ", " + d.getDate() + ". " + months[d.getMonth()];
  }
  function esc(s) {
    if (s === undefined || s === null) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function minutesBetween(t1, t2) {
    // t1, t2 = "HH:MM"; assumes t2 same day or next day if smaller
    var a = t1.split(":").map(Number), b = t2.split(":").map(Number);
    var m1 = a[0] * 60 + a[1], m2 = b[0] * 60 + b[1];
    var diff = m2 - m1;
    if (diff < 0) diff += 24 * 60;
    return diff;
  }
  function formatDuration(mins) {
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h === 0) return m + " min";
    if (m === 0) return h + " h";
    return h + " h " + m + " min";
  }

  // ---------- data ops ----------
  function addEntry(entry) {
    state.entries.push(Object.assign({ id: uid(), date: state.selectedDate }, entry));
    saveEntries();
    render();
  }
  function updateEntry(id, changes) {
    state.entries = state.entries.map(function (e) {
      if (e.id !== id) return e;
      var merged = Object.assign({}, e, changes);
      // remove keys that are explicitly undefined in changes (e.g. cleared amount/dose)
      Object.keys(changes).forEach(function (k) {
        if (changes[k] === undefined) delete merged[k];
      });
      return merged;
    });
    saveEntries();
    render();
  }
  function deleteEntry(id) {
    state.entries = state.entries.filter(function (e) { return e.id !== id && e.linkedTo !== id; });
    saveEntries();
    render();
  }
  function endActivity(id) {
    var time = nowHM();
    state.entries = state.entries.map(function (e) {
      if (e.id === id) { var c = Object.assign({}, e); c.endTime = time; return c; }
      return e;
    });
    saveEntries();
    render();
  }
  function linkSymptomTo(symptomId, targetId) {
    state.entries = state.entries.map(function (e) {
      if (e.id === symptomId) { var c = Object.assign({}, e); c.linkedTo = targetId; return c; }
      return e;
    });
    state.linkTarget = null;
    saveEntries();
    render();
  }
  function exportData() {
    var payload = { entries: state.entries, categories: state.categories, weights: state.weights };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "denik-export-" + todayISO() + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function shiftDate(delta) {
    var d = new Date(state.selectedDate + "T00:00:00");
    d.setDate(d.getDate() + delta);
    var tz = d.getTimezoneOffset() * 60000;
    state.selectedDate = new Date(d - tz).toISOString().slice(0, 10);
    render();
  }
  function getDayEntries() {
    return state.entries.filter(function (e) { return e.date === state.selectedDate; })
      .sort(function (a, b) { return (a.time || "").localeCompare(b.time || ""); });
  }
  function getAvailableDates() {
    var set = {};
    state.entries.forEach(function (e) { set[e.date] = true; });
    set[state.selectedDate] = true;
    return Object.keys(set).sort().reverse();
  }

  // ---------- import ----------
  function showToast(msg) {
    state.toast = msg; render();
    setTimeout(function () { state.toast = null; render(); }, 2400);
  }
  function isValidEntry(e) {
    return e && typeof e === "object" && typeof e.id === "string"
      && TYPE_ORDER.indexOf(e.type) !== -1
      && typeof e.date === "string" && typeof e.title === "string";
  }
  function handleImportFile(file) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var parsed;
      try { parsed = JSON.parse(ev.target.result); }
      catch (e) { showToast("Súbor sa nedá prečítať — nie je to platný export."); return; }

      var entries = Array.isArray(parsed) ? parsed : parsed.entries;
      var categories = Array.isArray(parsed) ? null : parsed.categories;
      var weights = Array.isArray(parsed) ? null : parsed.weights;

      if (!Array.isArray(entries) || !entries.every(isValidEntry)) {
        showToast("Súbor nemá očakávaný formát denníka.");
        return;
      }
      state.pendingImport = { entries: entries, categories: categories, weights: weights };
      render();
    };
    reader.onerror = function () { showToast("Súbor sa nepodarilo načítať."); };
    reader.readAsText(file);
  }
  function mergeCategories(incoming) {
    if (!incoming) return;
    Object.keys(incoming).forEach(function (k) {
      if (!state.categories[k]) return;
      incoming[k].forEach(function (c) {
        if (state.categories[k].indexOf(c) === -1) {
          state.categories[k].splice(state.categories[k].length - 1, 0, c);
        }
      });
    });
    saveCategories();
  }
  function mergeWeights(incoming, overwrite) {
    if (!incoming || typeof incoming !== "object") return;
    Object.keys(incoming).forEach(function (d) {
      if (overwrite || state.weights[d] === undefined) state.weights[d] = incoming[d];
    });
    saveWeights();
  }
  function confirmImportMerge() {
    var incoming = state.pendingImport.entries;
    var existingIds = {};
    state.entries.forEach(function (e) { existingIds[e.id] = true; });
    var added = 0;
    incoming.forEach(function (e) { if (!existingIds[e.id]) { state.entries.push(e); added++; } });
    mergeCategories(state.pendingImport.categories);
    mergeWeights(state.pendingImport.weights, false);
    state.pendingImport = null;
    saveEntries(); render();
    showToast("Pridaných " + added + " nových záznamov.");
  }
  function confirmImportReplace() {
    state.entries = state.pendingImport.entries.slice();
    mergeCategories(state.pendingImport.categories);
    if (state.pendingImport.weights) state.weights = Object.assign({}, state.pendingImport.weights);
    saveWeights();
    state.pendingImport = null;
    saveEntries(); render();
    showToast("Denník bol nahradený importovanými dátami.");
  }
  function cancelImport() { state.pendingImport = null; render(); }

  // ---------- render ----------
  var app = document.getElementById("app");

  function render() {
    var html = '';

    html += '<div class="wrap">';
    html += '<header>';
    html += '<div><h1 class="serif">Denník</h1><p>Jedlo, symptómy, aktivity a zdravie na jednom mieste</p><p style="font-size:10px;color:#C4BDAC;margin-top:4px;">verzia ' + esc(APP_VERSION) + '</p></div>';
    html += '<div class="header-actions">';
    html += '<button class="icon-btn" id="btn-theme-toggle" title="Prepnúť tmavý/svetlý režim">' + (state.theme === "dark" ? iconSun(16, "#8A8478") : iconMoon(16, "#8A8478")) + '</button>';
    html += '<button class="icon-btn" id="btn-print" title="Export na tlač">' + iconPrinter(16, "#8A8478") + '</button>';
    html += '<button class="icon-btn" id="btn-ai-export" title="Export pre AI analýzu">' + iconSparkles(16, "#8A8478") + '</button>';
    html += '<button class="icon-btn" id="btn-import" title="Importovať dáta">' + iconUpload(16, "#8A8478") + '</button>';
    html += '<button class="icon-btn" id="btn-export" title="Exportovať dáta">' + iconDownload(16, "#8A8478") + '</button>';
    html += '</div>';
    html += '<input type="file" id="import-file-input" accept="application/json,.json" style="display:none;" />';
    html += '</header>';

    if (state.error) html += '<div class="error-banner">' + esc(state.error) + '</div>';

    html += '<div class="tabnav">';
    html += '<button data-view="denik" class="' + (state.view === "denik" ? "active" : "") + '">Denník</button>';
    html += '<button data-view="statistiky" class="' + (state.view === "statistiky" ? "active" : "") + '">Štatistiky</button>';
    html += '</div>';

    html += '<div class="weight-card">';
    var selectedWeight = state.weights[state.selectedDate];
    html += '<div class="weight-card-left"><div class="weight-icon-badge">' + iconWeight(17, "#8A6B4F") + '</div><div>';
    if (selectedWeight !== undefined) {
      var prevForSelected = getPreviousWeightEntry(state.selectedDate);
      html += '<div class="weight-value serif">' + esc(selectedWeight) + ' kg';
      if (prevForSelected) {
        var delta = Math.round((selectedWeight - prevForSelected.kg) * 10) / 10;
        if (delta !== 0) {
          var cls = delta < 0 ? "down" : "up";
          html += '<span class="weight-delta ' + cls + '">' + (delta > 0 ? "+" : "") + delta + '</span>';
        }
      }
      html += '</div>';
      html += '<div class="weight-label">' + (state.selectedDate === todayISO() ? "Dnes" : formatDateHuman(state.selectedDate)) + '</div>';
    } else {
      html += '<div class="weight-value serif" style="color:#A39D8F;font-size:14px;">Zatiaľ nezaznamenané</div>';
      html += '<div class="weight-label">' + (state.selectedDate === todayISO() ? "Dnes" : formatDateHuman(state.selectedDate)) + '</div>';
    }
    html += '</div></div>';
    html += '<button class="weight-edit-btn" id="btn-weight-edit">' + (selectedWeight !== undefined ? "Upraviť" : "Zapísať") + '</button>';
    html += '</div>';

    if (state.view === "denik") {
      html += renderDenikView();
    } else {
      html += renderStatsView();
    }

    html += '</div>'; // wrap

    html += '<div class="actionbar"><div class="actionbar-inner">';
    html += '<button class="fab-add" id="btn-open-picker">' + iconPlus(18, "#FCFBF8") + '<span>Pridať záznam</span></button>';
    html += '</div></div>';

    if (state.typePicker) html += renderTypePicker();
    if (state.modal) {
      var editEntry = state.editId ? state.entries.find(function (e) { return e.id === state.editId; }) : null;
      var prefillEntry = editEntry || state.duplicateSeed;
      html += renderEntryModal(state.modal, prefillEntry, !!editEntry);
    }
    if (state.linkTarget) html += renderLinkModal(state.linkTarget);
    if (state.pendingImport) html += renderImportModal(state.pendingImport.entries);
    if (state.weightEditOpen) html += renderWeightModal();
    if (state.printModalOpen) html += renderPrintModal();
    if (state.aiExportModalOpen) html += renderAIExportModal();
    if (state.toast) html += '<div class="toast">' + esc(state.toast) + '</div>';

    html += '<div id="print-area"></div>';

    app.innerHTML = html;
    attachHandlers();
  }

  function renderDenikView() {
    var dayEntries = getDayEntries();
    var availableDates = getAvailableDates();
    var html = '';

    html += '<div class="datenav">';
    html += '<button id="btn-prev-day">‹</button>';
    html += '<div class="datenav-center"><div class="datenav-day serif">' + esc(formatDateHuman(state.selectedDate)) + '</div>';
    html += '<select id="date-select">';
    if (availableDates.indexOf(state.selectedDate) === -1) html += '<option value="' + state.selectedDate + '" selected>' + state.selectedDate + '</option>';
    availableDates.forEach(function (d) {
      html += '<option value="' + d + '"' + (d === state.selectedDate ? ' selected' : '') + '>' + (d === todayISO() ? 'Dnes' : d) + '</option>';
    });
    html += '</select></div>';
    html += '<button id="btn-next-day">›</button>';
    html += '</div>';

    if (dayEntries.length === 0) {
      html += '<div class="empty"><p class="serif">Tento deň je zatiaľ prázdny.</p><p>Pridaj prvý záznam tlačidlom dole.</p></div>';
    } else {
      html += '<div class="timeline"><div class="timeline-line"></div>';
      dayEntries.forEach(function (entry) { html += renderRow(entry); });
      html += '</div>';
    }
    return html;
  }

  function renderWeightModal() {
    var targetDate = state.selectedDate;
    var currentVal = state.weights[targetDate];
    var val = currentVal !== undefined ? currentVal : "";
    var dayLabel = targetDate === todayISO() ? "dnes" : formatDateHuman(targetDate);
    var h = '<div class="modal-overlay" id="weight-modal-overlay">';
    h += '<div class="modal-sheet">';
    h += '<div class="modal-header"><div class="modal-title-wrap"><div class="modal-icon-badge" style="background:#F1E9DF;color:#8A6B4F;">' + iconWeight(13, "#8A6B4F") + '</div><span class="modal-title serif">Hmotnosť — ' + esc(dayLabel) + '</span></div>';
    h += '<button class="modal-close" id="weight-modal-close">' + iconX(20) + '</button></div>';
    h += '<div class="field-row"><div class="field-col"><label class="field-label">Kilogramy</label><input class="field-input" id="field-weight" type="number" min="0" step="0.1" placeholder="napr. 78.5" value="' + esc(val) + '" /></div></div>';
    h += '<button type="button" class="submit-btn" id="submit-weight" style="background:#8A6B4F;">Uložiť</button>';
    if (currentVal !== undefined) {
      h += '<button type="button" id="delete-weight" style="background:none;border:none;color:#B0472E;font-size:12px;font-weight:600;margin-top:12px;width:100%;text-align:center;padding:4px;">Zmazať tento záznam</button>';
    }
    h += '</div></div>';
    return h;
  }

  // ---------- statistics ----------
  function daysAgoISO(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }

  function renderStatsView() {
    var html = '';

    // --- weight chart ---
    html += '<div class="stat-section">';
    html += '<h2 class="stat-section-title">Hmotnosť</h2>';
    html += '<div class="range-tabs">';
    [30, 90, 365].forEach(function (r) {
      html += '<button data-range="' + r + '" class="' + (state.statsRange === r ? "active" : "") + '">' + (r === 365 ? "1 rok" : r + " dní") + '</button>';
    });
    html += '</div>';
    html += renderWeightChart(state.statsRange);
    html += '</div>';

    // --- food-symptom links ---
    html += '<div class="stat-section">';
    html += '<h2 class="stat-section-title">Súvislosti jedlo → symptóm</h2>';
    html += renderFoodSymptomLinks();
    html += '</div>';

    // --- symptom frequency ---
    html += '<div class="stat-section">';
    html += '<h2 class="stat-section-title">Frekvencia symptómov (posledných 30 dní)</h2>';
    html += renderSymptomFrequency();
    html += '</div>';

    // --- summary tiles ---
    html += '<div class="stat-section">';
    html += '<h2 class="stat-section-title">Súhrn (posledných 7 dní)</h2>';
    html += renderSummaryTiles();
    html += '</div>';

    return html;
  }

  function renderWeightChart(rangeDays) {
    var fromDate = daysAgoISO(rangeDays);
    var dates = getSortedWeightDates().filter(function (d) { return d >= fromDate; });
    if (dates.length < 2) {
      return '<div class="chart-wrap"><p class="stat-empty">Zatiaľ nie je dosť záznamov hmotnosti na zobrazenie grafu (potrebné aspoň 2).</p></div>';
    }
    var values = dates.map(function (d) { return state.weights[d]; });
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (min === max) { min -= 1; max += 1; }
    var pad = (max - min) * 0.15;
    min -= pad; max += pad;

    var w = 600, h = 180, padX = 10, padY = 14;
    var innerW = w - padX * 2, innerH = h - padY * 2;
    var points = dates.map(function (d, i) {
      var x = padX + (dates.length === 1 ? 0 : (i / (dates.length - 1)) * innerW);
      var y = padY + innerH - ((state.weights[d] - min) / (max - min)) * innerH;
      return { x: x, y: y, date: d, val: state.weights[d] };
    });
    var pathD = points.map(function (p, i) { return (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
    var areaD = pathD + " L" + points[points.length - 1].x.toFixed(1) + "," + (padY + innerH) + " L" + points[0].x.toFixed(1) + "," + (padY + innerH) + " Z";

    var svg = '<svg class="weight-chart-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">';
    svg += '<path d="' + areaD + '" fill="#F1E9DF" stroke="none"/>';
    svg += '<path d="' + pathD + '" fill="none" stroke="#8A6B4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    points.forEach(function (p, i) {
      if (i === 0 || i === points.length - 1 || points.length < 8) {
        svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.5" fill="#8A6B4F"/>';
      }
    });
    svg += '</svg>';

    var first = points[0], lastP = points[points.length - 1];
    var change = Math.round((lastP.val - first.val) * 10) / 10;
    var changeLabel = (change > 0 ? "+" : "") + change + " kg za obdobie";

    return '<div class="chart-wrap">' + svg +
      '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#A39D8F;">' +
      '<span>' + esc(first.date) + ' · ' + esc(first.val) + ' kg</span>' +
      '<span style="font-weight:600;color:' + (change <= 0 ? "#5C7A6B" : "#B0472E") + ';">' + changeLabel + '</span>' +
      '<span>' + esc(lastP.date) + ' · ' + esc(lastP.val) + ' kg</span>' +
      '</div></div>';
  }

  function renderFoodSymptomLinks() {
    var symptoms = state.entries.filter(function (e) { return e.type === "symptom" && e.linkedTo; });
    if (symptoms.length === 0) {
      return '<p class="stat-empty">Zatiaľ nemáš prepojené žiadne symptómy s jedlom alebo aktivitou. Prepojenie urobíš v detaile symptómu na časovej osi.</p>';
    }
    // group by symptom title (case-insensitive), collect linked food/activity titles
    var groups = {};
    symptoms.forEach(function (s) {
      var linked = state.entries.find(function (e) { return e.id === s.linkedTo; });
      if (!linked) return;
      var key = s.title.trim().toLowerCase();
      if (!groups[key]) groups[key] = { label: s.title, count: 0, foods: {} };
      groups[key].count++;
      var foodKey = linked.title;
      groups[key].foods[foodKey] = (groups[key].foods[foodKey] || 0) + 1;
    });

    var groupList = Object.keys(groups).map(function (k) { return groups[k]; })
      .sort(function (a, b) { return b.count - a.count; });

    var html = '';
    groupList.forEach(function (g) {
      html += '<div class="link-stat-item">';
      html += '<div class="link-stat-top"><span class="link-stat-symptom">' + esc(g.label) + '</span><span class="link-stat-count">' + g.count + '× prepojené</span></div>';
      var foodList = Object.keys(g.foods).map(function (f) { return { name: f, count: g.foods[f] }; })
        .sort(function (a, b) { return b.count - a.count; });
      var maxCount = foodList[0].count;
      foodList.slice(0, 5).forEach(function (f) {
        var pct = Math.round((f.count / maxCount) * 100);
        html += '<div class="link-stat-food"><span class="link-stat-food-name">' + esc(f.name) + '</span>';
        html += '<div class="link-stat-bar-wrap"><div class="link-stat-bar" style="width:' + pct + '%;"></div></div>';
        html += '<span class="link-stat-food-count">' + f.count + '×</span></div>';
      });
      html += '</div>';
    });
    return html;
  }

  function renderSymptomFrequency() {
    var fromDate = daysAgoISO(30);
    var symptoms = state.entries.filter(function (e) { return e.type === "symptom" && e.date >= fromDate; });
    if (symptoms.length === 0) {
      return '<p class="stat-empty">Za posledných 30 dní nemáš zaznamenané žiadne symptómy.</p>';
    }
    var counts = {};
    symptoms.forEach(function (s) {
      var key = s.title.trim();
      counts[key] = (counts[key] || 0) + 1;
    });
    var list = Object.keys(counts).map(function (k) { return { label: k, count: counts[k] }; })
      .sort(function (a, b) { return b.count - a.count; });
    var maxCount = list[0].count;

    var html = '';
    list.forEach(function (item) {
      var pct = Math.round((item.count / maxCount) * 100);
      html += '<div class="freq-bar-row"><span class="freq-bar-label">' + esc(item.label) + '</span>';
      html += '<div class="freq-bar-track"><div class="freq-bar-fill" style="width:' + pct + '%;background:#F7E4DE;border:1px solid #B0472E;"></div></div>';
      html += '<span class="freq-bar-count">' + item.count + '</span></div>';
    });
    return html;
  }

  function renderSummaryTiles() {
    var fromDate = daysAgoISO(7);
    var recent = state.entries.filter(function (e) { return e.date >= fromDate; });

    var symptomCount = recent.filter(function (e) { return e.type === "symptom"; }).length;
    var liquidsMl = recent.filter(function (e) { return e.type === "tekutina" && e.amount; })
      .reduce(function (sum, e) { return sum + e.amount; }, 0);
    var activityMinutes = 0;
    recent.filter(function (e) { return e.type === "aktivita" && e.endTime; }).forEach(function (e) {
      activityMinutes += minutesBetween(e.time, e.endTime);
    });
    var mealCount = recent.filter(function (e) { return e.type === "jedlo"; }).length;

    var tiles = [
      { value: symptomCount, label: "symptómov", color: "#B0472E" },
      { value: Math.round(liquidsMl / 1000 * 10) / 10 + " l", label: "tekutín", color: "#3E7A8C" },
      { value: formatDuration(activityMinutes), label: "aktivít spolu", color: "#5C7A6B" },
      { value: mealCount, label: "jedál", color: "#8A6B4F" }
    ];

    var html = '<div class="summary-grid">';
    tiles.forEach(function (t) {
      html += '<div class="summary-tile"><div class="summary-tile-value serif" style="color:' + t.color + ';">' + esc(t.value) + '</div><div class="summary-tile-label">' + esc(t.label) + '</div></div>';
    });
    html += '</div>';
    return html;
  }

  function renderPrintModal() {
    var h = '<div class="modal-overlay" id="print-modal-overlay">';
    h += '<div class="modal-sheet">';
    h += '<div class="modal-header"><div class="modal-title-wrap"><div class="modal-icon-badge" style="background:#EFEAE0;color:#5A5548;">' + iconPrinter(13, "#5A5548") + '</div><span class="modal-title serif">Export na tlač</span></div>';
    h += '<button class="modal-close" id="print-modal-close">' + iconX(20) + '</button></div>';
    h += '<p style="font-size:13px;color:#5A5548;line-height:1.5;margin:0 0 14px;">Vyber obdobie a spôsob exportu. Ak appku používaš nainštalovanú (z plochy), zvoľ „Zdieľať / stiahnuť" — priame otvorenie tlače môže v tomto zobrazení appky zlyhať.</p>';

    var isCustom = state.printRangeMode === "custom";
    h += '<div class="range-tabs" id="print-range-tabs" style="margin-bottom:14px;">';
    [7, 14, 30].forEach(function (r) {
      var active = !isCustom && state.printRange === r;
      h += '<button data-print-range="' + r + '" class="' + (active ? "active" : "") + '">' + r + ' dní</button>';
    });
    h += '<button data-print-range="custom" class="' + (isCustom ? "active" : "") + '">Vlastné obdobie</button>';
    h += '</div>';

    if (isCustom) {
      var fromVal = state.printCustomFrom || daysAgoISO(6);
      var toVal = state.printCustomTo || todayISO();
      h += '<div class="field-row" style="margin-bottom:18px;">';
      h += '<div class="field-col"><label class="field-label">Od</label><input type="date" id="print-custom-from" class="field-input" value="' + esc(fromVal) + '" max="' + esc(todayISO()) + '" /></div>';
      h += '<div class="field-col"><label class="field-label">Do</label><input type="date" id="print-custom-to" class="field-input" value="' + esc(toVal) + '" max="' + esc(todayISO()) + '" /></div>';
      h += '</div>';
    }

    h += '<div style="display:flex;flex-direction:column;gap:8px;">';
    h += '<button type="button" class="submit-btn" id="submit-print-window" style="background:#2B2B26;">Otvoriť na tlač (nové okno)</button>';
    h += '<button type="button" class="copy-btn-secondary" id="submit-print-share">Zdieľať / stiahnuť súbor</button>';
    h += '</div>';
    h += '</div></div>';
    return h;
  }

  // Resolves the current print-range UI selection into a concrete
  // { from, to } date range, whichever mode (preset days-back vs custom
  // from/to) is active.
  function resolvePrintRange() {
    if (state.printRangeMode === "custom") {
      var from = state.printCustomFrom || daysAgoISO(6);
      var to = state.printCustomTo || todayISO();
      // guard against an inverted range (from after to) by swapping
      if (from > to) { var tmp = from; from = to; to = tmp; }
      return { from: from, to: to };
    }
    return { from: daysAgoISO(state.printRange - 1), to: todayISO() };
  }

  function buildPrintHTML(fromDate, toDate) {
    var relevantDates = {};
    state.entries.forEach(function (e) { if (e.date >= fromDate && e.date <= toDate) relevantDates[e.date] = true; });
    Object.keys(state.weights).forEach(function (d) { if (d >= fromDate && d <= toDate) relevantDates[d] = true; });
    var sortedDates = Object.keys(relevantDates).sort().reverse();

    var html = '<h1>Denník — prehľad</h1>';
    html += '<div class="print-meta">Obdobie: ' + esc(fromDate) + ' – ' + esc(toDate) + ' · vygenerované ' + esc(todayISO()) + '</div>';

    if (sortedDates.length === 0) {
      html += '<p>V tomto období nie sú žiadne záznamy.</p>';
      return html;
    }

    sortedDates.forEach(function (date) {
      var dayEntries = state.entries.filter(function (e) { return e.date === date; })
        .sort(function (a, b) { return (a.time || "").localeCompare(b.time || ""); });
      var weightVal = state.weights[date];

      html += '<div class="print-day">';
      html += '<div class="print-day-title">' + esc(formatDateHuman(date)) + ', ' + esc(date) + (weightVal ? ' · ' + esc(weightVal) + ' kg' : '') + '</div>';

      if (dayEntries.length === 0) {
        html += '<div class="print-row"><span class="p-body" style="color:#999;">Žiadne záznamy.</span></div>';
      } else {
        dayEntries.forEach(function (e) {
          var meta = TYPE_META[e.type];
          var body = esc(e.title);
          if (e.category) body += ' (' + esc(e.category) + ')';
          if (e.type === "symptom" && e.severity) {
            var sev = SEVERITY.find(function (s) { return s.v === e.severity; });
            body += ' — ' + (sev ? esc(sev.label) : '');
          }
          if (e.type === "vylucovanie" && e.bristol) {
            var b = BRISTOL.find(function (x) { return x.v === e.bristol; });
            body += b ? ' — typ ' + b.v + ' (' + esc(b.desc) + ')' : '';
          }
          if (e.type === "tekutina" && e.amount) body += ' — ' + esc(e.amount) + ' ml';
          if (e.type === "liek" && e.dose) body += ' — ' + esc(e.dose);
          if (e.type === "aktivita") {
            body += e.endTime ? (' (' + esc(e.time) + '–' + esc(e.endTime) + ', ' + formatDuration(minutesBetween(e.time, e.endTime)) + ')') : ' (prebieha)';
          }
          html += '<div class="print-row"><span class="p-time">' + esc(e.time || '') + '</span><span class="p-type" style="color:' + meta.color + ';">' + meta.label + '</span><span class="p-body">' + body;
          if (e.note) html += '<div class="p-note">' + esc(e.note) + '</div>';
          html += '</span></div>';
        });
      }
      html += '</div>';
    });
    return html;
  }

  // Opens the print content as a fully separate, static document in a new
  // window and triggers print there. This sidesteps a Samsung Internet issue
  // where content injected into the current page via innerHTML right before
  // window.print() sometimes doesn't make it into the print preview.
  // Detects whether the app is running as an installed standalone PWA
  // (added to home screen) rather than inside a normal browser tab.
  // Checks multiple signals because display-mode media query support is
  // inconsistent across Android WebView versions used by installed PWAs —
  // relying on just one has been observed to misreport standalone as false.
  function isStandalonePWA() {
    var byMediaQuery = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
    var byMediaQueryFullscreen = window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches;
    var byMediaQueryMinimalUi = window.matchMedia && window.matchMedia("(display-mode: minimal-ui)").matches;
    var byNavigatorStandalone = !!window.navigator.standalone; // older iOS-style flag, some Android WebViews mirror it
    var byReferrer = document.referrer.indexOf("android-app://") === 0; // set when launched via TWA/installed shortcut
    return byMediaQuery || byMediaQueryFullscreen || byMediaQueryMinimalUi || byNavigatorStandalone || byReferrer;
  }

  function openPrintWindow(range) {
    // window.open("_blank") has no browser chrome to open a new tab/window
    // into when running as an installed standalone PWA. Worse, window.print()
    // itself has been observed to freeze/crash the WebView in that mode (no
    // host for the native print dialog), so we avoid calling it at all here —
    // share/download the content instead.
    if (isStandalonePWA()) {
      offerPrintContentForStandalone(range);
      return;
    }

    var doc = buildFullPrintDocument(range, true);

    var printWin = null;
    try { printWin = window.open("", "_blank"); } catch (e) { printWin = null; }
    if (!printWin) {
      // Popup blocked or window.open unavailable for some other reason —
      // fall back to the safe share/download path rather than failing silently.
      offerPrintContentForStandalone(range);
      return;
    }
    printWin.document.open();
    printWin.document.write(doc);
    printWin.document.close();
  }

  // Builds a complete, standalone HTML document containing the print export.
  // range is { from: "YYYY-MM-DD", to: "YYYY-MM-DD" }.
  // autoPrint=true injects a script that calls window.print() on load — used
  // for the new-window path in a normal browser. autoPrint=false omits it —
  // used when the document is shared/downloaded as a file to be opened later
  // (e.g. in the installed standalone app, where we never call window.print()
  // ourselves), so the person opens it in their own time in a real browser
  // and can print, save as PDF, or email it from there.
  function buildFullPrintDocument(range, autoPrint) {
    var bodyHTML = buildPrintHTML(range.from, range.to);
    var doc = '<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
      '<title>Denník — export na tlač</title><style>' +
      'body{font-family:Georgia,"Times New Roman",serif;color:#1a1a1a;max-width:800px;margin:0 auto;padding:20px;}' +
      'h1{font-size:22px;margin-bottom:4px;}' +
      '.print-meta{font-size:12px;color:#666;margin-bottom:20px;font-family:-apple-system,sans-serif;}' +
      '.print-day{margin-bottom:22px;page-break-inside:avoid;}' +
      '.print-day-title{font-size:15px;font-weight:700;border-bottom:1.5px solid #333;padding-bottom:4px;margin-bottom:8px;text-transform:capitalize;}' +
      '.print-row{font-size:12.5px;padding:3px 0;display:flex;gap:8px;font-family:-apple-system,sans-serif;}' +
      '.print-row .p-time{color:#666;width:42px;flex-shrink:0;}' +
      '.print-row .p-type{width:78px;flex-shrink:0;font-weight:600;}' +
      '.print-row .p-body{flex:1;}' +
      '.print-row .p-note{color:#666;font-style:italic;}' +
      '.print-hint{font-size:12px;color:#666;font-family:-apple-system,sans-serif;margin-top:24px;padding-top:12px;border-top:1px solid #ddd;}' +
      '@media print { body { padding: 0; } .print-hint { display: none; } }' +
      '</style></head><body>' + bodyHTML;
    if (!autoPrint) {
      doc += '<p class="print-hint">Tento dokument otvor v prehliadači — odtiaľ ho vieš vytlačiť (menu → Tlačiť) alebo uložiť ako PDF.</p>';
    }
    doc += (autoPrint ? '<script>window.onload = function () { window.print(); };<\/script>' : '') +
      '</body></html>';
    return doc;
  }

  // Standalone PWA fallback: window.print() has been observed to freeze/crash
  // the installed app's WebView on some Android versions (ANR — "app not
  // responding" — followed by a crash), likely because there is no browser
  // chrome available to host the native print dialog. So instead of calling
  // window.print() at all in this mode, offer the content for sharing (Web
  // Share API, which hands off to whatever app the user picks — including a
  // print service if one is installed) or, failing that, download as a file.
  function offerPrintContentForStandalone(range) {
    var htmlDoc = buildFullPrintDocument(range, false);
    var fileName = "denik-export-" + range.from + "_" + range.to + ".html";

    if (navigator.share) {
      var file;
      try { file = new File([htmlDoc], fileName, { type: "text/html" }); } catch (e) { file = null; }
      var canShareFiles = file && navigator.canShare && navigator.canShare({ files: [file] });
      var sharePromise = canShareFiles
        ? navigator.share({ files: [file], title: "Denník — export" })
        : Promise.reject(new Error("File sharing not supported"));
      sharePromise.catch(function () {
        downloadHTMLFile(htmlDoc, fileName);
      });
    } else {
      downloadHTMLFile(htmlDoc, fileName);
    }
  }

  function downloadHTMLFile(html, fileName) {
    var blob = new Blob([html], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Súbor stiahnutý — otvor ho v prehliadači a odtiaľ vytlač alebo ulož ako PDF.");
  }

  // Builds a plain-text, chronological export intended to be pasted into an
  // AI chat for pattern analysis. Includes ALL entries — not just ones the
  // user has manually linked — so the AI can spot correlations the user
  // might have missed (e.g. a food eaten hours before a symptom that was
  // never explicitly connected).
  function buildAIExportText(days) {
    var fromDate = daysAgoISO(days - 1);
    var relevantDates = {};
    state.entries.forEach(function (e) { if (e.date >= fromDate) relevantDates[e.date] = true; });
    Object.keys(state.weights).forEach(function (d) { if (d >= fromDate) relevantDates[d] = true; });
    var sortedDates = Object.keys(relevantDates).sort();

    var lines = [];
    lines.push("ZDRAVOTNÝ DENNÍK — export na analýzu (" + fromDate + " až " + todayISO() + ")");
    lines.push("");
    lines.push("Toto sú chronologické záznamy o jedle, symptómoch, aktivitách, vylučovaní,");
    lines.push("príjme tekutín a liekoch/doplnkoch. Niektoré symptómy sú manuálne prepojené");
    lines.push("s konkrétnym jedlom alebo aktivitou (označené 'PREPOJENÉ S:'), iné nie —");
    lines.push("prosím, hľadaj aj skryté súvislosti, ktoré som si sám nemusel všimnúť");
    lines.push("(napr. jedlo alebo kombinácia jedál/aktivít v hodinách pred symptómom,");
    lines.push("opakujúce sa vzorce naprieč viacerými dňami, oneskorené reakcie, atď.).");
    lines.push("");
    lines.push("=".repeat(60));

    if (sortedDates.length === 0) {
      lines.push("V tomto období nie sú žiadne záznamy.");
      return lines.join("\n");
    }

    sortedDates.forEach(function (date) {
      var dayEntries = state.entries.filter(function (e) { return e.date === date; })
        .sort(function (a, b) { return (a.time || "").localeCompare(b.time || ""); });
      var weightVal = state.weights[date];

      lines.push("");
      lines.push(formatDateHuman(date).toUpperCase() + ", " + date + (weightVal ? " — hmotnosť: " + weightVal + " kg" : ""));

      if (dayEntries.length === 0) {
        lines.push("  (žiadne záznamy)");
        return;
      }

      dayEntries.forEach(function (e) {
        var meta = TYPE_META[e.type];
        var line = "  " + (e.time || "--:--") + " [" + meta.label + "] " + e.title;
        if (e.category) line += " (" + e.category + ")";
        if (e.type === "symptom" && e.severity) {
          var sev = SEVERITY.find(function (s) { return s.v === e.severity; });
          line += " — intenzita: " + (sev ? sev.label : "");
        }
        if (e.type === "vylucovanie" && e.bristol) {
          var b = BRISTOL.find(function (x) { return x.v === e.bristol; });
          line += b ? " — Bristol typ " + b.v + " (" + b.desc + ")" : "";
        }
        if (e.type === "tekutina" && e.amount) line += " — " + e.amount + " ml";
        if (e.type === "liek" && e.dose) line += " — " + e.dose;
        if (e.type === "aktivita") {
          line += e.endTime ? " (" + e.time + "–" + e.endTime + ", trvanie " + formatDuration(minutesBetween(e.time, e.endTime)) + ")" : " (prebiehala, koniec nezaznamenaný)";
        }
        if (e.note) line += "\n      poznámka: " + e.note;
        if (e.type === "symptom" && e.linkedTo) {
          var linked = state.entries.find(function (x) { return x.id === e.linkedTo; });
          if (linked) line += "\n      PREPOJENÉ S: " + linked.title + " (" + (linked.time || "") + ")";
        }
        lines.push(line);
      });
    });

    lines.push("");
    lines.push("=".repeat(60));
    lines.push("Koniec exportu.");
    return lines.join("\n");
  }

  function renderAIExportModal() {
    var text = buildAIExportText(state.aiExportRange);

  function renderTypePicker() {

  function renderRow(entry) {

    };

    h += '<div class="modal-title-wrap"><div class="modal-icon-badge" style="background:' + meta.bg + ';color:' + meta.color + ';">' + meta.svg(13, meta.color) + '</div>';

      // statistics. Renders a text input; typing filters a dropdown of

      });

      h += '<div id="bristol-wrap" style="margin-bottom:14px;display:' + (curToilet === "stolica" ? "block" : "none") + ';"><label class="field-label" style="margin-bottom:6px;">Bristolova škála (tvar stolice)</label><div class="bristol-grid" id="bristol-grid">';
      BRISTOL.forEach(function (b) {

    }

    // --- category chips for jedlo / aktivita / tekutina ---
    if (type === "jedlo" || type === "aktivita" || type === "tekutina") {
      var cats = state.categories[type];
      var curCategory = isEdit ? editEntry.category : null;
      var curCategoryIsCustom = curCategory && cats.indexOf(curCategory) === -1;

        h += '<button type="button" class="chip-btn' + (isActive ? ' active' : '') + '" data-category="' + esc(c) + '" style="' + chipStyle + '">' + esc(c) + '</button>';
      });
      h += '</div></div>';
      var customVal = curCategoryIsCustom ? esc(curCategory) : "";
      var customDisplay = curCategoryIsCustom ? "block" : "none";
      h += '<input class="field-input" id="field-custom-category" placeholder="Alebo napíš vlastnú kategóriu…" style="display:' + customDisplay + ';margin-bottom:14px;" value="' + customVal + '" />';
    }

    // --- amount for tekutina ---
    if (type === "tekutina") {
